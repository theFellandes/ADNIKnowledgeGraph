# Scratch / test Neo4j instance — ISOLATED from the canonical ADNI graph.
#
# Purpose: run the OASIS-2 cross-cohort transfer experiment (reviewer #2 / T10)
# without ever touching the canonical graph on the main stack (adni-kg-neo4j,
# bolt 7687, node 634,755 / edge 2,031,162 ...). This is a SEPARATE compose
# project (name: adni-kg-test) with its own container, network and volumes, so
# `docker compose -f docker-compose.test.yml up/down` cannot affect adni-kg-dev.
#
# Connect from the host with:  bolt://localhost:7688   (neo4j / your_password)
# Browser:                     http://localhost:7475
#
# Bring up:    docker compose -f docker-compose.test.yml up -d
# Tear down:   docker compose -f docker-compose.test.yml down          (keeps data volume)
# Wipe data:   docker compose -f docker-compose.test.yml down -v       (disposable scratch)

name: adni-kg-test

services:
  # Neo4j Graph Database — scratch instance for the OASIS-2 rerun
  neo4j_test:
    image: neo4j:5.24.2-community
    container_name: adni-kg-neo4j-test
    restart: unless-stopped
    ports:
      - "7475:7474"  # HTTP browser  (host 7475 -> container 7474)
      - "7688:7687"  # Bolt protocol (host 7688 -> container 7687)
    volumes:
      - neo4j_test_data:/data
      - neo4j_test_logs:/logs
      - neo4j_test_import:/var/lib/neo4j/import
      - neo4j_test_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/your_password
      - NEO4JLABS_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      # Advertise the host-mapped ports so the Browser connects to THIS instance
      # (7688), not the canonical 7687.
      - NEO4J_server_bolt_advertised__address=localhost:7688
      - NEO4J_server_http_advertised__address=localhost:7475
      # Trimmed memory: OASIS-2 is 373 rows; running a 2nd Neo4j alongside the
      # canonical one (4g heap) must not starve the host.
      - NEO4J_server_memory_heap_initial__size=1g
      - NEO4J_server_memory_heap_max__size=2g
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_dbms_memory_transaction_total_max=2g
      - server.config.strict_validation.enabled=false
    networks:
      - adni-test-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  adni-test-network:
    driver: bridge

volumes:
  neo4j_test_data:
    driver: local
  neo4j_test_logs:
    driver: local
  neo4j_test_import:
    driver: local
  neo4j_test_plugins:
    driver: local
