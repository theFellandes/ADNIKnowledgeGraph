# ADNI Knowledge Graph Pipeline Configuration
# Complete configuration with all required settings
#
# ⚠️  IMPORTANT: API keys and database passwords go in .env (NOT here).
#     See .env.example for the template. This file is committed to Git.
#     Secrets are loaded at runtime by utils/env_loader.py.

# ============================================================================
# PIPELINE MODE SETTINGS
# ============================================================================
# Choose ONE of these modes:
# - clear_database: true  - Delete all existing data first (DESTRUCTIVE)
# - incremental: true     - Add new data to existing (SAFE)
# - Both false           - Standard execution

clear_database: false # ⚠️ WARNING: This deletes ALL data in Neo4j AND Elasticsearch
incremental: true # ✅ RECOMMENDED: Preserve existing data and add new

# ============================================================================
# DATABASE CONNECTIONS
# ============================================================================

# Neo4j Database Settings
# Password loaded from .env → NEO4J_PASSWORD
neo4j_uri: "bolt://localhost:7687"
neo4j_user: "neo4j"
neo4j_password: "your_password" # Overridden by .env — do NOT put real password here

# Elasticsearch Settings
# Credentials (if needed) loaded from .env → ELASTICSEARCH_USERNAME, ELASTICSEARCH_PASSWORD
elasticsearch:
  host: "localhost"
  port: 9200
  username: null
  password: null

  # Index management
  indices:
    medical_images: "medical_images"
    patients: "adni_patients"
    studies: "adni_studies"
    biomarkers: "adni_biomarkers"
    assessments: "adni_assessments"

# ============================================================================
# DATA PATHS
# ============================================================================

# Base path containing ADNI data
base_path: "D:/Programming/Python/ADNIKnowledgeGraph/inputs"

# Output directory for logs and results
output_dir: "D:/Programming/Python/ADNIKnowledgeGraph/outputs"

# ============================================================================
# IMAGE PROCESSING SETTINGS (ENHANCED WITH ZIP SUPPORT)
# ============================================================================

# External storage for images (recommended)
use_external_storage: true
store_image_blobs: false

# Image Storage Configuration
image_storage:
  storage_path: "D:/Programming/Python/ADNIKnowledgeGraph/outputs/image_store"

  # ZIP PROCESSING
  zip_processing:
    mode: "auto"
    zip_directory: "D:/Programming/Python/ADNIKnowledgeGraph/inputs"
    extracted_directory: "D:/Programming/Python/ADNIKnowledgeGraph/inputs/extracted"

    zip_patterns:
      - "*.zip"
      - "mri_*.zip"
      - "pet_*.zip"
      - "*_scan_*.zip"

    extract_for_serving: false
    serving_cache_dir: "D:/Programming/Python/ADNIKnowledgeGraph/outputs/serving_cache"
    serving_cache_max_size_gb: 100
    serving_cache_cleanup_days: 30

    use_temp_extraction: false
    zip_parallel_workers: 4
    memory_threshold_gb: 8

  # CONVERSION SETTINGS
  prefer_dicom: true
  create_thumbnails: true
  thumbnail_size: [256, 256]
  lossless_compression: true

  # Output formats
  output_formats:
    tiff: true
    sharpened_tiff: true
    png: true
    thumbnail: true
    smooth_tiff: false
    jpeg2000: true # Lossless archival via glymur (Step 5b)
    pyramid_tiff: false # MUST be false

  # Elasticsearch indexing for images
  es_host: "localhost"
  es_port: 9200
  batch_size: 500

  # DICOM processing
  dicom:
    extract_full_metadata: true
    preserve_original: false
    skip_if_exists: true
    auto_window_level: true
    percentile_min: 2.0
    percentile_max: 98.0

  # NIfTI processing
  nifti:
    extract_slice: "middle"
    preserve_3d: false

  # Rendering settings
  rendering:
    interpolation_method: "bicubic"
    smoothing_enabled: false
    anti_aliasing: true
    quality: "high"
    upscale_factor: 2
    sharpening_strength: 0.5

# ============================================================================
# PROCESSING SETTINGS
# ============================================================================

max_workers: 16

batch_processing:
  image_batch_size: 500
  data_batch_size: 1000
  enable_progress_tracking: true
  checkpoint_interval: 200
  memory_threshold: 0.8
  garbage_collection_interval: 1000

# ============================================================================
# PIPELINE STEP CONTROL — Original Steps (1–16)
# ============================================================================

run_database_setup: true # Step 1: Setup Neo4j and Elasticsearch
run_table_loading: true # Step 2: Load CSV tables
run_patient_creation: true # Step 3: Create patient nodes
run_family_extraction: true # Step 4: Extract family relationships
run_image_processing: true # Step 5: Process medical images
run_findings_extraction: true # Step 6: Extract clinical findings
run_batch_insertion: true # Step 7: Batch insert remaining data
run_relationship_creation: true # Step 8: Create all relationships
run_knowledge_enhancement: true # Step 9: Enhance knowledge graph
run_query_execution: true # Step 10: Execute queries and reports
run_biomarker_analysis: true # Step 11: Analyze biomarkers
run_graph_enhancement: true # Step 12: External data enrichment
run_graph_eda: true # Step 13: Export to CSV/JSON/GraphML
run_research_queries: true # Step 14: Execute research queries
run_complete_graph_enhancement: true # Step 15: Event-based graph
run_create_metrics: true # Step 16: Create metrics

# ============================================================================
# PIPELINE STEP CONTROL — New Steps (17–28): Semantic Migration & Causal
# ============================================================================
# These are OFF by default — enable as you reach each phase.

# Phase 1: Semantic Migration
run_apply_constraints: false # Step 17: Composite unique constraints
run_ontology_properties: false # Step 18: Add SNOMED/LOINC/UBERON codes
run_icd10_integration: false # Step 19: ICD-10 via WHO API + static map
run_ontology_layer: false # Step 20: OntologyConcept + MAPS_TO rels

# Phase 2: Causal Discovery
run_causal_feature_extraction: false # Step 21: Extract baseline features + MICE
run_causal_discovery: false # Step 22: PC/FCI/GES algorithms
run_embed_causal_edges: false # Step 23: Write CAUSES edges (with run_id)

# Phase 3: Validation & Integration
run_alzkb_bridge: true # Step 24: AlzKB SAME_AS integration
run_evaluate_causality: false # Step 25: SHD, F1, precision/recall
run_dowhy_inference: false # Step 26: Causal effect estimation
run_final_stats: true # Step 27: Graph statistics report
run_thesis_figures: true # Step 28: Publication-quality figures
run_kg_eda: true # Step 29: KG Exploratory Data Analysis (13 figures)

# ============================================================================
# EXTERNAL API SETTINGS (keys loaded from .env via utils/env_loader.py)
# ============================================================================

# BioPortal REST API — for SNOMED-CT, LOINC, UBERON ontology lookups
# API key loaded from .env → BIOPORTAL_API_KEY
bioportal:
  base_url: "https://data.bioontology.org"
  rate_limit_per_minute: 15 # BioPortal free tier limit
  cache_ttl_seconds: 86400 # Cache responses 24h in Redis

# WHO ICD REST API — for ICD-10 disease classification hierarchy
# client_id/secret loaded from .env → WHO_ICD_CLIENT_ID, WHO_ICD_CLIENT_SECRET
who_icd:
  token_url: "https://icdaccessmanagement.who.int/connect/token"
  api_url: "https://id.who.int/icd"
  release: "2019"
  api_version: "v2"
  rate_limit_per_minute: 30
  cache_ttl_seconds: 604800 # Cache 7 days (ICD codes rarely change)

# AlzKB Integration — no API key needed (GitHub download)
alzkb:
  github_url: "https://github.com/EpistasisLab/AlzKB"
  max_concepts: 200
  cache_dir: "ontology/alzkb_cache"

# ============================================================================
# CAUSAL DISCOVERY SETTINGS (Phase 2)
# ============================================================================

causal:
  alpha: 0.05 # Significance level for CI tests
  algorithms: ["PC", "FCI", "GES"]
  consensus_threshold: 2 # Edges found by ≥N algorithms are kept
  independence_test: "kci" # kci for mixed data, fisherz for continuous-only
  max_missing_pct: 0.5 # Drop patients with >50% missing
  imputation_method: "mice" # mice | test_wise_deletion
  feature_selection: true # KG-guided Markov blanket pre-filtering
  output_dir: "causal"

# ============================================================================
# ERROR HANDLING
# ============================================================================

error_handling:
  continue_on_error: true
  max_retries: 3
  retry_delay: 5
  validate_data: true
  skip_invalid: true
  log_invalid: true
  create_error_report: true
  error_report_path: "outputs/error_report.json"

# ============================================================================
# LOGGING
# ============================================================================

log_level: "INFO"
log_file: "D:/Programming/Python/ADNIKnowledgeGraph/outputs/pipeline.log"

logging:
  log_to_file: true
  log_to_console: true
  rotate_logs: true
  max_log_size_mb: 100
  backup_count: 5

  components:
    neo4j: "INFO"
    elasticsearch: "INFO"
    image_processing: "DEBUG"
    batch_processing: "INFO"
    table_loading: "INFO"
    patient_creation: "INFO"
    family_extraction: "INFO"

# ============================================================================
# INCREMENTAL PROCESSING OPTIONS
# ============================================================================

incremental_options:
  duplicate_strategy: "skip"
  track_processed: true
  processed_tracking_file: "outputs/processed_items.json"
  process_after_date: null
  enable_checkpoints: true
  checkpoint_dir: "outputs/checkpoints"
  resume_from_checkpoint: true
  incremental_batch_size: 100

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================

performance:
  neo4j:
    batch_size: 1000
    use_unwind: true
    periodic_commit: 1000
    transaction_timeout: 300
    connection_pool_size: 50
    connection_acquisition_timeout: 60

  elasticsearch:
    bulk_size: 500
    refresh_interval: "30s"
    number_of_replicas: 0
    request_timeout: 30
    max_retries: 3

  image_processing:
    convert_parallel: true
    max_concurrent_conversions: 4
    cache_metadata: true
    max_image_size_mb: 500
    downsample_large_images: true
    downsampling_threshold_mb: 100

  table_processing:
    chunk_size: 10000
    use_dtype_optimization: true
    category_threshold: 0.5

# ============================================================================
# DATA QUALITY CHECKS
# ============================================================================

quality_checks:
  enable: true
  validate_patient_ids: true
  validate_dates: true
  check_referential_integrity: true

  required_fields:
    patient: ["ptid"]
    visit: ["visit_id", "patient_id", "viscode"]
    image: ["image_hash", "patient_id"]

  min_completeness: 0.7
  max_null_percentage: 0.3

  verify_counts: true
  verify_relationships: true
  generate_quality_report: true
  quality_report_path: "outputs/quality_report.json"

  detect_outliers: true
  flag_missing_data: true
  outlier_detection_method: "iqr"
  check_temporal_consistency: true
  check_value_ranges: true

# ============================================================================
# CACHE SETTINGS
# ============================================================================

cache:
  enable: true
  cache_dir: "outputs/cache"
  cache_processed_images: true
  cache_table_data: true
  cache_patient_data: true
  max_cache_size_gb: 50
  cache_ttl_days: 30
  clear_cache_on_start: false

# ============================================================================
# EXPORT SETTINGS
# ============================================================================

export:
  enable: true
  export_dir: "outputs/exports"
  formats:
    csv: true
    json: true
    graphml: true
    gephi: false
  export_nodes: true
  export_relationships: true
  export_properties: true
  export_batch_size: 10000
