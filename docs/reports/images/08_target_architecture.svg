<svg xmlns="http://www.w3.org/2000/svg" width="780" height="550" viewBox="0 0 780 550">
<defs>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .title { font-size: 16px; font-weight: bold; fill: #1a1a2e; }
    .sub { font-size: 11px; fill: #555; }
    .lbl { font-size: 10px; fill: #333; font-weight: 600; }
    .sm { font-size: 9px; fill: #666; }
    .xs { font-size: 8px; fill: #888; }
    .cnt { font-size: 9px; fill: #0d47a1; font-weight: bold; }
    .elbl { font-size: 8px; fill: #c62828; font-weight: 600; }
    .prop { font-size: 7.5px; fill: #444; font-family: Consolas, monospace; }
  </style>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#555"/>
  </marker>
  <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
  </marker>
  <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#c62828"/>
  </marker>
  <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#2e7d32"/>
  </marker>
  <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#6a1b9a"/>
  </marker>
</defs>
<text x="390" y="22" class="title" text-anchor="middle">Target Architecture: ADNI Causal Knowledge Graph</text>
<text x="390" y="40" class="sub" text-anchor="middle">Final state after all 4 phases — as planned in ADNI_KG_Design_Blueprint.pdf</text>
